name: Command Center Production Health

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: command-center-production-health
  cancel-in-progress: false

jobs:
  health:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        github.event.issue.user.login == github.repository_owner &&
        github.event.issue.title == '[Approved Production Health Check] Command Center'
      )
    runs-on: ubuntu-latest
    environment: apps-script-production
    steps:
      - name: Require protected authorization
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$CLASPRC_JSON" ]; then
            echo "CLASPRC_JSON is not configured; refusing health check."
            exit 1
          fi

      - name: Check out authoritative main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install compatible Apps Script CLI
        run: npm install --global @google/clasp@3.3.0

      - name: Prepare protected authorization
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          AUTH_FILE="$RUNNER_TEMP/clasprc.json"
          printf '%s' "$CLASPRC_JSON" > "$AUTH_FILE"
          chmod 600 "$AUTH_FILE"
          echo "CLASP_AUTH_FILE=$AUTH_FILE" >> "$GITHUB_ENV"

      - name: Update existing owner-only API deployment to Version 56
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENTS="$(clasp -A "$CLASP_AUTH_FILE" deployments)"
          API_LINE="$(printf '%s\n' "$DEPLOYMENTS" | grep -F 'Command Center aggregate-only read-only API' | head -1)"
          DEPLOYMENT_ID="$(printf '%s\n' "$API_LINE" | grep -Eo 'AKfycb[A-Za-z0-9_-]+' | head -1)"
          test -n "$DEPLOYMENT_ID"
          clasp -A "$CLASP_AUTH_FILE" deploy -i "$DEPLOYMENT_ID" -V 56 -d 'Command Center aggregate-only read-only API'
          clasp -A "$CLASP_AUTH_FILE" deployments | grep -F "$DEPLOYMENT_ID @56"

      - name: Run aggregate-only production health check
        id: health
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(clasp -A "$CLASP_AUTH_FILE" run runCommandCenterProductionHealth --nondev)"
          printf '%s\n' "$RESULT"
          printf '%s\n' "$RESULT" | grep -F '"completed":true'
          printf '%s\n' "$RESULT" | grep -F '"allModuleSafetyVerified":true'
          printf '%s\n' "$RESULT" | grep -F '"airtableWritesRequested":0'
          printf '%s\n' "$RESULT" | grep -F '"executionEnabled":0'
          printf '%s\n' "$RESULT" | grep -F '"businessesLaunched":0'
          {
            echo 'result<<EOF'
            printf '%s\n' "$RESULT"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Record health-check success
        if: ${{ success() && github.event_name == 'issues' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          HEALTH_RESULT: ${{ steps.health.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue close "$ISSUE_NUMBER" --reason completed --comment "Production health check passed. Aggregate result: $HEALTH_RESULT Run: $RUN_URL"

      - name: Record health-check failure
        if: ${{ failure() && github.event_name == 'issues' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body "Production health check stopped safely. No success was recorded. Inspect: $RUN_URL"
