name: Command Center Production Deployment Integrity

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: command-center-production-health
  cancel-in-progress: false

jobs:
  health:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        github.event.issue.user.login == github.repository_owner &&
        github.event.issue.title == '[Approved Production Integrity Check] Command Center'
      )
    runs-on: ubuntu-latest
    environment: apps-script-production
    steps:
      - name: Require protected authorization
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$CLASPRC_JSON" ]; then
            echo "CLASPRC_JSON is not configured; refusing health check."
            exit 1
          fi

      - name: Check out authoritative main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install compatible Apps Script CLI
        run: npm install --global @google/clasp@3.3.0

      - name: Prepare protected authorization
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          AUTH_FILE="$RUNNER_TEMP/clasprc.json"
          printf '%s' "$CLASPRC_JSON" > "$AUTH_FILE"
          chmod 600 "$AUTH_FILE"
          echo "CLASP_AUTH_FILE=$AUTH_FILE" >> "$GITHUB_ENV"

      - name: Update owner-only API deployment to source-expected version
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(sed -nE 's/.*productionVersionExpected:[[:space:]]*([0-9]+).*/\1/p' CommandCenterHealth.js | head -1)"
          test -n "$EXPECTED_VERSION"
          echo "EXPECTED_HEALTH_VERSION=$EXPECTED_VERSION" >> "$GITHUB_ENV"
          DEPLOYMENTS="$(clasp -A "$CLASP_AUTH_FILE" deployments)"
          API_LINE="$(printf '%s\n' "$DEPLOYMENTS" | grep -F 'Command Center aggregate-only read-only API' | head -1)"
          DEPLOYMENT_ID="$(printf '%s\n' "$API_LINE" | grep -Eo 'AKfycb[A-Za-z0-9_-]+' | head -1)"
          test -n "$DEPLOYMENT_ID"
          clasp -A "$CLASP_AUTH_FILE" deploy -i "$DEPLOYMENT_ID" -V "$EXPECTED_VERSION" -d 'Command Center aggregate-only read-only API'

          VERIFIED=false
          for ATTEMPT in 1 2 3 4 5; do
            CURRENT_DEPLOYMENTS="$(clasp -A "$CLASP_AUTH_FILE" deployments)"
            if printf '%s\n' "$CURRENT_DEPLOYMENTS" | grep -F "$DEPLOYMENT_ID @$EXPECTED_VERSION"; then
              VERIFIED=true
              break
            fi
            echo "Deployment list has not converged yet (attempt $ATTEMPT of 5)."
            sleep 2
          done

          if [ "$VERIFIED" != true ]; then
            echo "API deployment verification failed after bounded retries."
            exit 1
          fi

          echo "HEALTH_API_DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_ENV"

      - name: Record deployment integrity result
        id: integrity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "result=Production deployment integrity verified at Apps Script Version $EXPECTED_HEALTH_VERSION. Full seven-module health remains owner-session-only in the authenticated dashboard."
          } >> "$GITHUB_OUTPUT"

      - name: Record deployment-integrity success
        if: ${{ success() && github.event_name == 'issues' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          INTEGRITY_RESULT: ${{ steps.integrity.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue close "$ISSUE_NUMBER" --reason completed --comment "$INTEGRITY_RESULT Run: $RUN_URL"

      - name: Record deployment-integrity failure
        if: ${{ failure() && github.event_name == 'issues' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body "Production deployment integrity check stopped safely. No success was recorded. Inspect: $RUN_URL"
