name: Knowledge Center and Second Brain Validation

on:
  pull_request:
    paths:
      - 'src/apps-script/knowledgeSecondBrain.js'
      - 'tests/knowledgeSecondBrain.test.js'
      - '.github/workflows/knowledge-second-brain-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Knowledge Center regression
        run: node tests/knowledgeSecondBrain.test.js
