name: Dashboard Routing Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'Phase9_ExecutiveDashboard.html'
      - 'ZZ_DashboardRoutingPatch.js'
      - 'ZZZ_DashboardNotificationsPatch.js'
      - 'ZZZZ_DashboardHealthDrilldownPatch.js'
      - 'ZZZZZ_DashboardKpiNavigationPatch.js'
      - 'ZZZZZZ_DashboardHashRoutingPatch.js'
      - 'ZZZZZZZ_DashboardMobileNavigationPatch.js'
      - 'ZZZZZZZZ_DashboardDailyBriefingPatch.js'
      - 'ZZZZZZZZZ_DashboardActivityRecoveryPatch.js'
      - 'tests/dashboard-review-routing.validation.js'
      - 'tests/dashboard-notifications.validation.js'
      - 'tests/dashboard-health-drilldown.validation.js'
      - 'tests/dashboard-kpi-navigation.validation.js'
      - 'tests/dashboard-hash-routing.validation.js'
      - 'tests/dashboard-mobile-navigation.validation.js'
      - 'tests/dashboard-daily-briefing.validation.js'
      - 'tests/dashboard-activity-recovery.validation.js'
      - '.github/workflows/dashboard-routing-validation.yml'
  push:
    branches: [main]
    paths:
      - 'Phase9_ExecutiveDashboard.html'
      - 'ZZ_DashboardRoutingPatch.js'
      - 'ZZZ_DashboardNotificationsPatch.js'
      - 'ZZZZ_DashboardHealthDrilldownPatch.js'
      - 'ZZZZZ_DashboardKpiNavigationPatch.js'
      - 'ZZZZZZ_DashboardHashRoutingPatch.js'
      - 'ZZZZZZZ_DashboardMobileNavigationPatch.js'
      - 'ZZZZZZZZ_DashboardDailyBriefingPatch.js'
      - 'ZZZZZZZZZ_DashboardActivityRecoveryPatch.js'
      - 'tests/dashboard-review-routing.validation.js'
      - 'tests/dashboard-notifications.validation.js'
      - 'tests/dashboard-health-drilldown.validation.js'
      - 'tests/dashboard-kpi-navigation.validation.js'
      - 'tests/dashboard-hash-routing.validation.js'
      - 'tests/dashboard-mobile-navigation.validation.js'
      - 'tests/dashboard-daily-briefing.validation.js'
      - 'tests/dashboard-activity-recovery.validation.js'
      - '.github/workflows/dashboard-routing-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-dashboard-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate patch syntax
        run: |
          node --check ZZ_DashboardRoutingPatch.js
          node --check ZZZ_DashboardNotificationsPatch.js
          node --check ZZZZ_DashboardHealthDrilldownPatch.js
          node --check ZZZZZ_DashboardKpiNavigationPatch.js
          node --check ZZZZZZ_DashboardHashRoutingPatch.js
          node --check ZZZZZZZ_DashboardMobileNavigationPatch.js
          node --check ZZZZZZZZ_DashboardDailyBriefingPatch.js
          node --check ZZZZZZZZZ_DashboardActivityRecoveryPatch.js

      - name: Validate review-filter routing
        run: node tests/dashboard-review-routing.validation.js

      - name: Validate notifications
        run: node tests/dashboard-notifications.validation.js

      - name: Validate System Health drill-down
        run: node tests/dashboard-health-drilldown.validation.js

      - name: Validate KPI navigation
        run: node tests/dashboard-kpi-navigation.validation.js

      - name: Validate hash restoration
        run: node tests/dashboard-hash-routing.validation.js

      - name: Validate mobile navigation
        run: node tests/dashboard-mobile-navigation.validation.js

      - name: Validate daily executive briefing
        run: node tests/dashboard-daily-briefing.validation.js

      - name: Validate activity and recovery center
        run: node tests/dashboard-activity-recovery.validation.js
