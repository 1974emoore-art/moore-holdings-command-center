name: Real Estate Lifecycle Dashboard Validation

on:
  pull_request:
    paths:
      - 'ZZZZZZZZZZZZZZZZZZZZ_RealEstateLifecycleDashboard.js'
      - 'tests/real-estate-lifecycle-dashboard.validation.js'
      - '.github/workflows/real-estate-lifecycle-dashboard-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Real Estate lifecycle dashboard
        run: node tests/real-estate-lifecycle-dashboard.validation.js
