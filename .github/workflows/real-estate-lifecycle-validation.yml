name: Real Estate Lifecycle Validation

on:
  pull_request:
    paths:
      - 'ZZZZZZZZZZ_RealEstateLifecycleModel.js'
      - 'tests/real-estate-lifecycle.validation.js'
      - '.github/workflows/real-estate-lifecycle-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/real-estate-lifecycle.validation.js
