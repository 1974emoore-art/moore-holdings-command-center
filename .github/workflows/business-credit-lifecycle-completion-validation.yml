name: Business Credit Lifecycle Completion Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'BusinessCreditLifecycleCompletion.js'
      - 'tests/business-credit-lifecycle-completion.validation.js'
      - '.github/workflows/business-credit-lifecycle-completion-validation.yml'
  push:
    branches: [main]
    paths:
      - 'BusinessCreditLifecycleCompletion.js'
      - 'tests/business-credit-lifecycle-completion.validation.js'
      - '.github/workflows/business-credit-lifecycle-completion-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-business-credit-lifecycle-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check BusinessCreditLifecycleCompletion.js
      - run: node tests/business-credit-lifecycle-completion.validation.js
