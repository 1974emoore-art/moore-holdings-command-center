name: Apps Script Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)

      - name: Verify Phase 7 live-write safety gate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const orchestrator = fs.readFileSync('Phase7_BatchProcessor.js', 'utf8');
          const writer = fs.readFileSync('Phase7_ReviewWriter.gs.js', 'utf8');

          if (!orchestrator.includes('isPhase7WriteAuthorizationArmed_()')) {
            throw new Error('Phase 7 independent authorization check is missing.');
          }

          if (orchestrator.includes('armPhase7WriteAuthorization();')) {
            throw new Error('Phase 7 orchestrator must not arm its own write authorization.');
          }

          const requiredWriterControls = [
            'PHASE7_WRITE_AUTHORIZATION_TTL_MS',
            'clearPhase7WriteAuthorization_()',
            "properties.deleteProperty('PHASE7_WRITE_AUTHORIZATION')",
            "properties.deleteProperty('PHASE7_WRITE_AUTHORIZED_AT')",
            'previewPhase7LiveReconciliation()',
            'executeApprovedPhase7LiveRun()',
            'disarmPhase7WriteAuthorization()',
            'airtableRequestSent: false'
          ];

          for (const control of requiredWriterControls) {
            if (!writer.includes(control)) {
              throw new Error('Phase 7 safety control is missing: ' + control);
            }
          }

          const controlledRun = writer.match(
            /function executeApprovedPhase7LiveRun\(\) \{[\s\S]*?\n\}/
          );

          if (!controlledRun || !controlledRun[0].includes('finally')) {
            throw new Error('Controlled live run must always clear authorization.');
          }

          console.log('Phase 7 live-write safety gate verified.');
          NODE

      - name: Verify Phase 8 terminal-decision protection
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const phase8 = fs.readFileSync('Phase8_AIReviewLayer.js', 'utf8');

          const requiredControls = [
            'PHASE8_TERMINAL_OVERRIDE_CODE',
            'previewPhase8DecisionTransition',
            'fetchPhase8ReviewRecordById_',
            'terminalOverrideRequired',
            'phase7ReviewRecordsChanged: 0',
            'personalCreditRecordsChanged: false'
          ];

          for (const control of requiredControls) {
            if (!phase8.includes(control)) {
              throw new Error('Phase 8 decision protection is missing: ' + control);
            }
          }

          const decisionFunction = phase8.match(
            /function setPhase8ReviewDecision\([\s\S]*?\n\}/
          );

          if (
            !decisionFunction ||
            !decisionFunction[0].includes('currentIsTerminal') ||
            !decisionFunction[0].includes('terminalOverrideCode')
          ) {
            throw new Error('Phase 8 terminal decisions are not independently protected.');
          }

          console.log('Phase 8 terminal-decision protection verified.');
          NODE
