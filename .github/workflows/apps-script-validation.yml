name: Apps Script Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)

      - name: Verify Phase 7 live-write safety gate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const orchestrator = fs.readFileSync('Phase7_BatchProcessor.js', 'utf8');
          const writer = fs.readFileSync('Phase7_ReviewWriter.gs.js', 'utf8');

          if (!orchestrator.includes('isPhase7WriteAuthorizationArmed_()')) {
            throw new Error('Phase 7 independent authorization check is missing.');
          }

          if (orchestrator.includes('armPhase7WriteAuthorization();')) {
            throw new Error('Phase 7 orchestrator must not arm its own write authorization.');
          }

          const requiredWriterControls = [
            'PHASE7_WRITE_AUTHORIZATION_TTL_MS',
            'clearPhase7WriteAuthorization_()',
            "properties.deleteProperty('PHASE7_WRITE_AUTHORIZATION')",
            "properties.deleteProperty('PHASE7_WRITE_AUTHORIZED_AT')",
            'previewPhase7LiveReconciliation()',
            'executeApprovedPhase7LiveRun()',
            'disarmPhase7WriteAuthorization()',
            'airtableRequestSent: false'
          ];

          for (const control of requiredWriterControls) {
            if (!writer.includes(control)) {
              throw new Error('Phase 7 safety control is missing: ' + control);
            }
          }

          const controlledRun = writer.match(
            /function executeApprovedPhase7LiveRun\(\) \{[\s\S]*?\n\}/
          );

          if (!controlledRun || !controlledRun[0].includes('finally')) {
            throw new Error('Controlled live run must always clear authorization.');
          }

          console.log('Phase 7 live-write safety gate verified.');
          NODE

      - name: Verify Phase 8 terminal-decision protection
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const phase8 = fs.readFileSync('Phase8_AIReviewLayer.js', 'utf8');

          const requiredControls = [
            'PHASE8_TERMINAL_OVERRIDE_CODE',
            'previewPhase8DecisionTransition',
            'fetchPhase8ReviewRecordById_',
            'terminalOverrideRequired',
            'phase7ReviewRecordsChanged: 0',
            'personalCreditRecordsChanged: false'
          ];

          for (const control of requiredControls) {
            if (!phase8.includes(control)) {
              throw new Error('Phase 8 decision protection is missing: ' + control);
            }
          }

          const decisionFunction = phase8.match(
            /function setPhase8ReviewDecision\([\s\S]*?\n\}/
          );

          if (
            !decisionFunction ||
            !decisionFunction[0].includes('currentIsTerminal') ||
            !decisionFunction[0].includes('terminalOverrideCode')
          ) {
            throw new Error('Phase 8 terminal decisions are not independently protected.');
          }

          console.log('Phase 8 terminal-decision protection verified.');
          NODE

      - name: Verify Phase 10 approval gates
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const phase10 = fs.readFileSync('Phase10Final.js', 'utf8');

          const requiredControls = [
            'PHASE10_QUEUE_RESET_CONFIRMATION_CODE',
            'PHASE10_DECISION_CONFIRMATION_CODE',
            'PHASE10_TERMINAL_DECISION_OVERRIDE_CODE',
            'PHASE10_PDF_AUTHORIZATION_TTL_MS',
            'previewPhase10ApprovedPdfProduction',
            'armPhase10PdfAuthorization',
            'disarmPhase10PdfAuthorization',
            'clearPhase10PdfAuthorization_()',
            'filesCreated: 0',
            'airtableRecordsUpdated: 0'
          ];

          for (const control of requiredControls) {
            if (!phase10.includes(control)) {
              throw new Error('Phase 10 approval control is missing: ' + control);
            }
          }

          const pdfRunner = phase10.match(
            /function runPhase10ApprovedPdfProduction\(\) \{[\s\S]*?\n\}/
          );

          if (
            !pdfRunner ||
            !pdfRunner[0].includes('authorization.armed') ||
            !pdfRunner[0].includes('finally')
          ) {
            throw new Error('Phase 10 PDF production is not protected by one-time authorization.');
          }

          const resetRunner = phase10.match(
            /function resetAndRegeneratePhase10\([\s\S]*?\n\}/
          );

          if (
            !resetRunner ||
            !resetRunner[0].includes('PHASE10_QUEUE_RESET_CONFIRMATION_CODE')
          ) {
            throw new Error('Phase 10 queue reset is not independently protected.');
          }

          console.log('Phase 10 approval gates verified.');
          NODE

      - name: Enforce Phase 9 read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const phase9 = fs.readFileSync('Phase9Promotion.js', 'utf8');

          const forbiddenPatterns = [
            /method\s*:\s*['"]post['"]/i,
            /method\s*:\s*['"]patch['"]/i,
            /method\s*:\s*['"]put['"]/i,
            /method\s*:\s*['"]delete['"]/i,
            /DocumentApp\.create\s*\(/,
            /createFile\s*\(/,
            /setPhase8ReviewDecision\s*\(/,
            /createPhase10ApprovedPdfs_\s*\(/
          ];

          for (const pattern of forbiddenPatterns) {
            if (pattern.test(phase9)) {
              throw new Error('Phase 9 read-only boundary violated by: ' + pattern);
            }
          }

          if (!phase9.includes('lettersMailed: 0')) {
            throw new Error('Phase 9 must explicitly report zero mailed letters.');
          }

          console.log('Phase 9 read-only boundary verified.');
          NODE

      - name: Verify read-only preview bridge
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const bridge = fs.readFileSync('ReadOnlyPreview.js', 'utf8');
          const manifest = JSON.parse(fs.readFileSync('appsscript.json', 'utf8'));
          const workflow = fs.readFileSync(
            '.github/workflows/command-center-read-only-preview.yml',
            'utf8'
          );

          if (
            !manifest.executionApi ||
            manifest.executionApi.access !== 'MYSELF'
          ) {
            throw new Error('Execution API must remain owner-only.');
          }

          const requiredBridgeControls = [
            'runPhase9HeldAccountPromotionReview()',
            'runPhase10FinalSystemCompletion()',
            'airtableWritesRequested: 0',
            'airtableRecordsChanged: 0',
            'filesCreated: 0',
            'pdfsCreated: 0',
            'lettersMailed: 0',
            'messagesSent: 0',
            'paymentsAuthorized: 0'
          ];

          for (const control of requiredBridgeControls) {
            if (!bridge.includes(control)) {
              throw new Error('Read-only bridge control missing: ' + control);
            }
          }

          const forbiddenBridgePatterns = [
            /UrlFetchApp\.fetch\s*\(/,
            /DocumentApp\.create\s*\(/,
            /createFile\s*\(/,
            /armPhase7WriteAuthorization\s*\(/,
            /executeApprovedPhase7LiveRun\s*\(/,
            /savePhase10ReviewDecision\s*\(/,
            /armPhase10PdfAuthorization\s*\(/,
            /runPhase10ApprovedPdfProduction\s*\(/
          ];

          for (const pattern of forbiddenBridgePatterns) {
            if (pattern.test(bridge)) {
              throw new Error('Read-only bridge contains forbidden action: ' + pattern);
            }
          }

          const requiredWorkflowControls = [
            "github.event.issue.user.login == github.repository_owner",
            "github.event.issue.title == '[Approved Read-Only Preview] Phase 9 and Phase 10'",
            '"airtableWritesRequested":0',
            '"filesCreated":0',
            '"messagesSent":0'
          ];

          for (const control of requiredWorkflowControls) {
            if (!workflow.includes(control)) {
              throw new Error('Preview workflow control missing: ' + control);
            }
          }

          console.log('Read-only preview bridge verified.');
          NODE
