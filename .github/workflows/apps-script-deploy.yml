name: Apps Script Production Deployment

on:
  workflow_dispatch:
    inputs:
      description:
        description: Deployment description
        required: true
        default: Controlled Command Center production release
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        github.event.issue.user.login == github.repository_owner &&
        startsWith(github.event.issue.title, '[Approved Production Deploy]')
      )
    runs-on: ubuntu-latest
    environment: apps-script-production
    steps:
      - name: Require deployment authorization
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$CLASPRC_JSON" ]; then
            echo "CLASPRC_JSON is not configured; refusing production deployment."
            exit 1
          fi

      - name: Check out validated main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install compatible Apps Script CLI
        run: |
          set -euo pipefail
          npm install --global @google/clasp@3.3.0
          clasp --version

      - name: Prepare protected authorization
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          AUTH_FILE="$RUNNER_TEMP/clasprc.json"
          printf '%s' "$CLASPRC_JSON" > "$AUTH_FILE"
          chmod 600 "$AUTH_FILE"
          echo "CLASP_AUTH_FILE=$AUTH_FILE" >> "$GITHUB_ENV"

      - name: Verify project mapping
        run: clasp -A "$CLASP_AUTH_FILE" status

      - name: Push exact repository source
        run: clasp -A "$CLASP_AUTH_FILE" push --force

      - name: Create immutable Apps Script version
        id: version
        shell: bash
        env:
          RELEASE_DESCRIPTION: ${{ github.event_name == 'workflow_dispatch' && inputs.description || github.event.issue.title }}
        run: |
          set -euo pipefail
          OUTPUT="$(clasp -A "$CLASP_AUTH_FILE" version "$RELEASE_DESCRIPTION")"
          printf '%s\n' "$OUTPUT"
          VERSION="$(printf '%s\n' "$OUTPUT" | grep -Eo '[0-9]+' | tail -1)"
          test -n "$VERSION"
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update existing production deployment
        env:
          RELEASE_DESCRIPTION: ${{ github.event_name == 'workflow_dispatch' && inputs.description || github.event.issue.title }}
        run: >-
          clasp -A "$CLASP_AUTH_FILE" redeploy
          AKfycbzXYZJv9gjhPFJpxPBizyci5Dp6ak0putViUSZ6Olurc_MhpZ1wmS9tfg20unaIKcszSw
          --versionNumber ${{ steps.version.outputs.number }}
          --description "$RELEASE_DESCRIPTION"

      - name: Verify production deployment version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.number }}
          PRODUCTION_DEPLOYMENT_ID: AKfycbzXYZJv9gjhPFJpxPBizyci5Dp6ak0putViUSZ6Olurc_MhpZ1wmS9tfg20unaIKcszSw
        run: |
          set -euo pipefail
          DEPLOYMENTS="$(clasp -A "$CLASP_AUTH_FILE" deployments)"
          printf '%s\n' "$DEPLOYMENTS"
          EXPECTED="$PRODUCTION_DEPLOYMENT_ID @$EXPECTED_VERSION"
          if ! printf '%s\n' "$DEPLOYMENTS" | grep -F "$EXPECTED"; then
            echo "Production verification failed: expected $EXPECTED."
            exit 1
          fi
          echo "Production deployment verified at version $EXPECTED_VERSION."

      - name: Record approved deployment success
        if: ${{ success() && github.event_name == 'issues' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          VERSION: ${{ steps.version.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue close "$ISSUE_NUMBER" --reason completed --comment "Production deployment verified at Apps Script Version $VERSION. Run: $RUN_URL"

      - name: Record approved deployment failure
        if: ${{ failure() && github.event_name == 'issues' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body "Production deployment stopped safely. No success was recorded. Inspect: $RUN_URL"
